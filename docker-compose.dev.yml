services:
  dev:
    image: node:20-alpine
    working_dir: /app
    user: node
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - ./data:/app/data
      - ./public/images:/app/public/images
    environment:
      SITE_URL: ${SITE_URL:-http://localhost:8080}
      WHATSAPP_NUMBER: "${WHATSAPP_NUMBER:-[ISI: nomor WA]}"
    command: sh -c "npm ci --include=optional --no-audit --no-fund && npm run dev"
