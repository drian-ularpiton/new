services:
  web:
    build:
      context: .
      args:
        SITE_URL: ${SITE_URL:-http://localhost:8080}
        WHATSAPP_NUMBER: "${WHATSAPP_NUMBER:-[ISI: nomor WA]}"
    ports:
      - "8080:80"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
